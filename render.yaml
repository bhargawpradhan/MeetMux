services:
  - type: web
    name: meetmux-control-tower
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8050
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
